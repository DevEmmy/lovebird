name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  flutter:
    name: Flutter analyze, test & web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: |
          flutter --version
          echo "::notice title=Flutter::$(flutter --version | head -1)"
      - run: flutter pub get
      - name: Analyze
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings --write=analysis.txt > /dev/null
          code=$?
          # Surface every diagnostic as a GitHub annotation (visible on the run page).
          grep -E '^\[(error|warning|info)\]' analysis.txt | while IFS= read -r line; do
            sev=$(echo "$line" | sed -E 's/^\[(\w+)\].*/\1/')
            loc=$(echo "$line" | sed -E 's/.*\(([^()]*):([0-9]+):([0-9]+)\)$/\1|\2/')
            file=$(echo "$loc" | cut -d'|' -f1 | sed "s#^$PWD/#app/#")
            ln=$(echo "$loc" | cut -d'|' -f2)
            msg=$(echo "$line" | sed -E 's/^\[\w+\] //; s/ \([^()]*:[0-9]+:[0-9]+\)$//')
            [ "$sev" = info ] && sev=notice
            echo "::$sev file=$file,line=$ln::$msg"
          done
          echo "::notice title=Analyzer::$(grep -cE '^\[error\]' analysis.txt) errors, $(grep -cE '^\[warning\]' analysis.txt) warnings, $(grep -cE '^\[info\]' analysis.txt) infos"
          exit $code
      - name: Unit tests
        run: flutter test
      - name: Web build (compile check)
        run: |
          flutter create --platforms web --org io.lovebird --project-name lovebird . >/dev/null
          flutter build web --dart-define=SUPABASE_URL=https://example.supabase.co --dart-define=SUPABASE_ANON_KEY=ci

  database:
    name: Database security suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Migrations + isolation tests
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          ./supabase/tests/run_local.sh 2>&1 | tee out.txt
          grep -q "ALL ISOLATION & SECURITY CHECKS PASSED" out.txt
