name: Deploy web demo

# Builds the Flutter web app and publishes it to GitHub Pages.
# Supabase URL + publishable (anon) key. These are public by design — every request is
# still checked by row-level security in the database. Repo variables, if set, override these.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://yktovfpxclhbwcoaauny.supabase.co' }}
  SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || 'sb_publishable_-xcYlVha_7X3pABYW2nS4A_2UKcoWiv' }}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - name: Check the database is set up
        run: |
          code=$(curl -s -o body.json -w '%{http_code}' "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1" -H "apikey: $SUPABASE_ANON_KEY")
          echo "::notice title=Database check::HTTP $code $(head -c 200 body.json)"
          if [ "$code" != "200" ]; then echo "::error title=Database not ready::Run supabase/setup_all.sql in the Supabase SQL Editor"; fi
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter create --platforms web --org io.lovebird --project-name lovebird . >/dev/null
      - name: Build
        run: |
          flutter build web --release \
            --base-href "/${{ github.event.repository.name }}/" \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY \
            --dart-define=AUTH_REDIRECT=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ \
            --dart-define=WEB_ORIGIN=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          cp build/web/index.html build/web/404.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: app/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
